<header
  class="fixed w-full top-0 z-50 transition-all duration-500 ease-in-out border-b border-white/10"
  [class.header-scrolled]="isScrolled"
  [class.header-top]="!isScrolled"
>
  <div class="w-full px-6 md:px-12 py-4 flex items-center justify-between">
    <!-- Brand / Identity -->
    <a href="#" class="flex items-center gap-3.5 group">
      <span class="font-mono text-xs font-black tracking-widest text-white border border-white/20 px-2.5 py-1 rounded-sm bg-white/5 group-hover:border-lime-400 group-hover:text-lime-400 transition-colors">
        HN // 26
      </span>
      <div class="flex flex-col">
        <span class="text-xs font-mono font-bold tracking-widest text-white uppercase group-hover:text-lime-400 transition-colors">
          HUMAYUN A. NILOY
        </span>
        <span class="text-[9px] font-mono text-slate-400 tracking-wider">
          SOFTWARE ENGINEER // FULL-STACK & 3D
        </span>
      </div>
    </a>

    <!-- Center Editorial Indices -->
    <nav class="hidden lg:flex items-center space-x-8 font-mono text-xs tracking-[0.22em] text-slate-400 uppercase">
      <a href="#about" class="hover:text-white transition-colors flex items-center gap-1.5 group">
        <span class="text-[10px] text-lime-400 font-bold">01</span>
        <span class="group-hover:translate-x-0.5 transition-transform">ABOUT</span>
      </a>
      <a href="#experience" class="hover:text-white transition-colors flex items-center gap-1.5 group">
        <span class="text-[10px] text-lime-400 font-bold">02</span>
        <span class="group-hover:translate-x-0.5 transition-transform">EXPERIENCE</span>
      </a>
      <a href="#skills" class="hover:text-white transition-colors flex items-center gap-1.5 group">
        <span class="text-[10px] text-lime-400 font-bold">03</span>
        <span class="group-hover:translate-x-0.5 transition-transform">SKILLS</span>
      </a>
      <a href="#portfolio" class="hover:text-white transition-colors flex items-center gap-1.5 group">
        <span class="text-[10px] text-lime-400 font-bold">04</span>
        <span class="group-hover:translate-x-0.5 transition-transform">PROJECTS</span>
      </a>
    </nav>

    <!-- Right: Availability & Action Button -->
    <div class="flex items-center gap-5">
      <div class="hidden sm:flex items-center gap-2.5 font-mono text-[10px] text-slate-400 border-l border-white/10 pl-5">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-lime-500"></span>
        </span>
        <span class="tracking-widest">OPEN TO OPPORTUNITIES</span>
      </div>

      <a
        href="#contact"
        class="relative inline-flex items-center justify-center px-5 py-2 overflow-hidden font-mono text-xs font-bold tracking-widest uppercase transition-all duration-300 rounded-full bg-lime-400 text-black hover:bg-white hover:shadow-[0_0_25px_rgba(132,204,22,0.6)] transform hover:scale-105"
      >
        <span>LET'S TALK</span>
        <i class="fas fa-arrow-up-right-from-square text-[9px] ml-1.5"></i>
      </a>

      <!-- Mobile Menu Toggle Button -->
      <button
        class="lg:hidden relative w-9 h-9 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-white focus:outline-none hover:bg-white/10 transition-colors"
        (click)="toggleMobileMenu()"
        aria-label="Toggle mobile navigation"
      >
        <i class="fas fa-bars text-sm" *ngIf="!isMenuOpen"></i>
        <i class="fas fa-times text-sm text-lime-400" *ngIf="isMenuOpen"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div
    *ngIf="isMenuOpen"
    [@menuToggle]
    class="lg:hidden border-t border-white/10 bg-black/90 backdrop-blur-2xl px-6 py-6"
  >
    <div class="flex flex-col space-y-4 font-mono text-xs tracking-[0.2em] uppercase">
      <a
        href="#about"
        (click)="closeMenu()"
        class="text-slate-300 hover:text-lime-400 py-2 border-b border-white/5 flex justify-between items-center"
      >
        <span>01 // ABOUT</span>
        <i class="fas fa-arrow-right text-[10px] opacity-40"></i>
      </a>
      <a
        href="#experience"
        (click)="closeMenu()"
        class="text-slate-300 hover:text-lime-400 py-2 border-b border-white/5 flex justify-between items-center"
      >
        <span>02 // EXPERIENCE</span>
        <i class="fas fa-arrow-right text-[10px] opacity-40"></i>
      </a>
      <a
        href="#skills"
        (click)="closeMenu()"
        class="text-slate-300 hover:text-lime-400 py-2 border-b border-white/5 flex justify-between items-center"
      >
        <span>03 // SKILLS</span>
        <i class="fas fa-arrow-right text-[10px] opacity-40"></i>
      </a>
      <a
        href="#portfolio"
        (click)="closeMenu()"
        class="text-slate-300 hover:text-lime-400 py-2 border-b border-white/5 flex justify-between items-center"
      >
        <span>04 // PROJECTS</span>
        <i class="fas fa-arrow-right text-[10px] opacity-40"></i>
      </a>
    </div>
  </div>
</header>
